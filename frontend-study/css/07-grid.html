<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grid의 행과 열</title>
  <style>
body { font-family: sans-serif; margin: 24px; line-height: 1.6; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
article { padding: 24px; background: #e5f4ed; border: 1px solid #345; }
.wide { grid-column: span 2; }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } .wide { grid-column: auto; } }
  </style>
</head>
<body>
<h1>행과 열로 배치하기</h1><div class="grid"><article class="wide">넓은 카드</article><article>카드 2</article><article>카드 3</article><article>카드 4</article></div>
</body>
</html>
