<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>선택자와 적용 순서</title>
  <style>
body { font-family: sans-serif; margin: 24px; line-height: 1.6; }
/* 같은 조건에서는 명시도, 명시도까지 같으면 작성 순서를 비교 */
p { color: #333; }
p { color: #245; }
.note { color: #705000; }
#special { color: #a02050; }
.title { font-size: 2rem; }
  </style>
</head>
<body>
<h1 class="title">CSS 복습</h1><p>요소 선택자로 고른 문단</p><p class="note">클래스로 고른 문단</p><p id="special" class="note">ID로 고른 문단</p>
</body>
</html>
