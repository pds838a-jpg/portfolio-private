<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가상 클래스와 함수</title>
  <style>
body { font-family: sans-serif; margin: 24px; line-height: 1.6; }
h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); }
.list > li { padding: 8px; }
.list > li:nth-child(odd) { background: #edf5ff; }
button:hover { background: #def; }
button:focus-visible { outline: 3px solid #246; outline-offset: 4px; }
.label::before { content: '✦ '; }
.label { width: min(100%, 400px); padding: 12px; background: #eef; box-sizing: border-box; }
  </style>
</head>
<body>
<h1>상태와 선택자</h1><ul class="list"><li>첫 항목</li><li>둘째 항목</li><li>셋째 항목</li></ul><button type="button">마우스 또는 Tab으로 확인</button><p class="label">복습</p>
</body>
</html>
