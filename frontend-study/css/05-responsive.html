<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>반응형과 단위</title>
  <style>
body { font-family: sans-serif; margin: 24px; line-height: 1.6; }
h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
article { padding: 20px; background: #edf5ff; }
@media (max-width: 600px) { .cards { grid-template-columns: 1fr; } }
/* 이미지가 있다면 max-width:100%; height:auto;로 비율 유지 */
  </style>
</head>
<body>
<h1>화면 너비에 맞추기</h1><div class="cards"><article>HTML</article><article>CSS</article><article>JavaScript</article></div><p>600px 이하에서는 한 열이 됩니다.</p>
</body>
</html>
