<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>padding과 margin</title>
  <style>
body { font-family: sans-serif; margin: 24px; line-height: 1.6; }
/* padding은 안쪽, margin은 테두리 바깥 여백 */
.card { width: 200px; padding: 20px; border: 2px solid #345; margin: 16px; background: #edf5ff; }
.content { box-sizing: content-box; }
.border { box-sizing: border-box; }
  </style>
</head>
<body>
<h1>박스 크기 비교</h1><div class="card content">content-box: 내용 너비 200px</div><div class="card border">border-box: 테두리까지 200px</div><p>개발자 도구에서 244px과 200px을 비교합니다.</p>
</body>
</html>
