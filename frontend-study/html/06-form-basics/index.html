<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>폼 기본 복습</title>
</head>
<body>
  <h1>입력 항목 연습</h1>
  <p>입력 UI를 복습하는 예제이며, 실제 가입이나 정보 저장 기능은 없습니다.</p>
  <form method="get">
    <fieldset>
      <legend>학습 정보</legend>
      <p><label for="nickname">연습용 별명</label>
        <input type="text" id="nickname" name="nickname"></p>
      <p><label for="topic">공부할 주제</label>
        <select id="topic" name="topic">
          <option value="html">HTML</option><option value="css">CSS</option>
        </select></p>
      <p><label for="memo">메모</label>
        <textarea id="memo" name="memo" rows="3"></textarea></p>
    </fieldset>
    <fieldset>
      <legend>복습 방식: 하나 선택</legend>
      <label><input type="radio" name="practice" value="read">코드 읽기</label>
      <label><input type="radio" name="practice" value="edit">코드 수정하기</label>
    </fieldset>
    <fieldset>
      <legend>확인할 항목: 여러 개 선택 가능</legend>
      <label><input type="checkbox" name="check" value="label">라벨 연결</label>
      <label><input type="checkbox" name="check" value="name">name 속성</label>
    </fieldset>
    <button type="submit">전송 형식 확인</button>
  </form>
  <p>제출하면 현재 페이지의 URL에 입력 항목이 표시됩니다. 서버에 저장하지 않습니다. 개인정보 대신 연습용 값을 사용하세요.</p>
</body>
</html>
