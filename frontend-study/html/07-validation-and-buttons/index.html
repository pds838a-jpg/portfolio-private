<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>입력 검사와 버튼 복습</title>
</head>
<body>
  <h1>입력 검사 연습</h1>
  <p>이메일은 전송되지 않습니다. name@example.com 같은 연습용 값을 사용하세요.</p>
  <form method="get">
    <p><label for="email">연습용 이메일 주소: 필수</label>
      <input type="email" id="email" name="email" placeholder="name@example.com" required></p>
    <p><label for="nickname">별명: 2~10글자</label>
      <input type="text" id="nickname" name="nickname" minlength="2" maxlength="10" required></p>
    <p><label for="course">수업: 읽기 전용</label>
      <input type="text" id="course" name="course" value="HTML 기초" readonly></p>
    <p><label for="disabled-note">비활성화된 항목</label>
      <input type="text" id="disabled-note" name="disabledNote" value="전송되지 않는 값" disabled></p>
    <button type="submit">입력 확인</button>
    <button type="reset">초기값으로 되돌리기</button>
    <button type="button">동작을 연결하지 않은 일반 버튼</button>
  </form>
  <p>브라우저 검사는 입력을 도와주는 기능입니다. 실제 서비스에서는 서버에서도 검증해야 합니다.</p>
</body>
</html>
