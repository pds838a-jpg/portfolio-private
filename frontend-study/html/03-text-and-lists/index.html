<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>텍스트와 목록 복습</title>
</head>
<body>
  <h1>HTML 복습 노트</h1>
  <h2>문단과 강조</h2>
  <p>HTML은 내용의 <strong>구조와 역할</strong>을 표현합니다.</p>
  <p>태그 이름을 외우는 것보다 <em>어떤 상황에서 쓰는지</em> 이해하고 싶습니다.</p>
  <p>이것은 같은 문단 안에서<br>줄을 바꾼 예제입니다.</p>
  <h2>공부할 기술</h2>
  <ul><li>HTML</li><li>CSS</li><li>JavaScript</li></ul>
  <h2>복습 순서</h2>
  <ol><li>코드 읽기</li><li>내용 수정하기</li><li>브라우저에서 확인하기</li></ol>
  <h2>용어 정리</h2>
  <dl>
    <dt>태그</dt><dd>요소의 시작이나 끝을 표시하는 문법입니다.</dd>
    <dt>속성</dt><dd>요소에 추가 정보를 지정합니다.</dd>
  </dl>
</body>
</html>
