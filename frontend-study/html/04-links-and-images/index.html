<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>링크와 이미지 복습</title>
</head>
<body>
  <h1>링크와 이미지</h1>
  <p><a href="profile.html">같은 폴더에 있는 소개 페이지로 이동</a></p>
  <p><a href="#path-note">페이지 안의 경로 설명으로 이동</a></p>
  <figure>
    <img src="images/study.svg" alt="HTML, CSS, JavaScript를 적은 학습 노트 그림" width="360" height="220">
    <figcaption>상대 경로 연습을 위해 만든 설명 그림</figcaption>
  </figure>
  <h2 id="path-note">경로 메모</h2>
  <p>images/study.svg는 현재 HTML 파일 아래의 images 폴더에 있는 그림입니다.</p>
  <p>alt는 이미지의 대체 설명이고, figcaption은 화면에 보이는 설명입니다.</p>
</body>
</html>
